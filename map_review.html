<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Village Map Review</title>
<style>
  :root {
    --bg: #f6f3ee; --panel: #ffffff; --text: #1f1d1a; --muted: #6b655c; --line: #e2ddd4;
    --red: #d63a2f; --green: #1f9d55; --path: #1d4ed8; --river: #38bdf8;
    --high: #c2410c; --medium: #a16207; --low: #4d7c0f; --hl: #fff4c2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161513; --panel: #201f1c; --text: #ece8e1; --muted: #a39d93; --line: #35322d;
      --high: #fb923c; --medium: #facc15; --low: #a3e635; --hl: #3a3420;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161513; --panel: #201f1c; --text: #ece8e1; --muted: #a39d93; --line: #35322d;
    --high: #fb923c; --medium: #facc15; --low: #a3e635; --hl: #3a3420;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .note { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 14px; font-size: .9rem; color: var(--muted); margin-bottom: 16px; }
  .note code, li code { font-size: .85em; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
  @media (min-width: 960px) {
    .layout { grid-template-columns: minmax(0, 560px) minmax(0, 1fr); align-items: start; }
    .mapwrap { position: sticky; top: 16px; }
  }
  .map { position: relative; width: 100%; border-radius: 8px; overflow: hidden;
    border: 1px solid var(--line); background: #000; }
  .map img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
  .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .85rem; color: var(--muted); margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 2px solid; }

  .marker { transition: opacity .15s; }
  .marker text { font: 700 11px system-ui, sans-serif; fill: #fff; stroke: #000; stroke-width: 3px;
    paint-order: stroke; pointer-events: none; }
  svg.dim .marker:not(.hl) { opacity: .15; }
  .marker.hl circle { stroke-width: 3.5; }
  .marker.hl text { font-size: 15px; }
  .station text { font: 600 9px system-ui, sans-serif; fill: #fff; stroke: #0b1d52; stroke-width: 3px; paint-order: stroke; }

  h2 { font-size: 1.05rem; margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
  h2 .pill { font-size: .75rem; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c);
    border-radius: 8px; padding: 10px 12px; cursor: default; transition: background .12s; }
  li.hl { background: var(--hl); }
  .head { display: flex; gap: 10px; align-items: baseline; }
  .num { font-weight: 700; min-width: 1.8em; color: var(--c); }
  .name { font-weight: 600; word-break: break-word; flex: 1; min-width: 0; }
  .pos { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .85rem; color: var(--muted); margin: 4px 0 4px 2.3em; }
  .pos b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .why { margin: 0 0 0 2.3em; font-size: .92rem; }
</style>
</head>

<script>
const CAM = { x: 0, y: 0, size: 27 };   // temporary ortho capture camera
const ITEMS = [{"n": 1, "prio": "high", "name": "Grid/BaseRiverTilemap + Grid/RiverTilemap + Grid/CollisionTilemap (old west strand)", "parent": null, "cur": [-14.5, -7.0], "prop": [-10.0, -5.8], "local": null, "why": "Bend the river from the falls toward the town's south-west instead of running it straight down the map edge, so the restored river flows through the village after Mission 2 instead of around it."}, {"n": 2, "prio": "high", "name": "Grid/BaseRiverTilemap + Grid/RiverTilemap + Grid/CollisionTilemap (old south strand)", "parent": null, "cur": [1.5, -17.2], "prop": [3.5, -11.6], "local": null, "why": "Bring the river up to the town's southern edge (via (\u22127.5,\u22128.5), (0,\u221211.5), (8,\u221212), (13.5,\u221210.5)) so it separates the town from the farm bank, giving the player a natural reason to cross it."}, {"n": 3, "prio": "high", "name": "Grid/BaseRiverTilemap + Grid/RiverTilemap + Grid/CollisionTilemap (old north-east strand)", "parent": null, "cur": [17.5, 3.0], "prop": "remove", "local": null, "why": "Remove the strand that runs up the east side and off the top edge. It makes the river a moat with no source or destination, and the path beside it dead-ends at the map border."}, {"n": 4, "prio": "high", "name": "Grid/BaseRiverTilemap + Grid/RiverTilemap + Grid/CollisionTilemap (new exit)", "parent": null, "cur": null, "prop": [16.8, -21.5], "local": null, "why": "Add new: carry the river south from under the Mission 5 bridge and off the bottom edge, so the bridge spans a north\u2013south river as its build area assumes."}, {"n": 5, "prio": "high", "name": "Grid/GroundTilemap + Grid/CollisionTilemap (footbridge)", "parent": null, "cur": null, "prop": [-4.5, -9.7], "local": null, "why": "Add new: an always-open footbridge from the plaza to the farm bank, because missions can be played in any order and the broken Mission 5 bridge must never be the only way to reach Missions 1 and 3."}, {"n": 6, "prio": "high", "name": "Entities/PlayerHouse", "parent": null, "cur": [-8.25, -9.55], "prop": [4.0, 16.8], "local": null, "why": "Its current spot sits in the new river course; up the cliff stairs it becomes the player's own quiet corner, set apart from town like the Stardew farmhouse."}, {"n": 7, "prio": "high", "name": "Entities/TrashCan", "parent": null, "cur": [-5.65, -11.48], "prop": [5.6, -8.3], "local": null, "why": "This TrashCollectionSite sits in the new river course; between the plaza and the market it's on the route trash is collected along."}, {"n": 8, "prio": "high", "name": "Entities/Well", "parent": null, "cur": [-8.79, -6.46], "prop": [-6.0, -15.5], "local": null, "why": "Mission 1 is 'Parched Crops', so its trigger belongs in the farm district beside the fields rather than wedged between houses at the edge of the plaza."}, {"n": 9, "prio": "high", "name": "Mission1/Container_Trivial_M1/WellPatchTarget", "parent": null, "cur": [-8.78, -6.13], "prop": [-5.99, -15.17], "local": null, "why": "Must move with the Well (same +2.79, \u22129.04 offset), or the trivial patch step will be on empty ground away from the well."}, {"n": 10, "prio": "high", "name": "Mission1/Container_Trivial_M1/Indicator", "parent": null, "cur": [-8.8, -3.73], "prop": [-6.01, -12.77], "local": null, "why": "Same offset as the Well, so the trivial path's prompt icon still hovers over it."}, {"n": 11, "prio": "high", "name": "Entities/FarmHouse", "parent": null, "cur": [-7.59, 1.83], "prop": [-12.5, -12.0], "local": null, "why": "Anchors the farm district on the south bank, which frees the west side of the plaza and gives the farm a home building."}, {"n": 12, "prio": "high", "name": "Mission3/RoutineBoardInteractable", "parent": "Mission3", "cur": [-10.13, -2.62], "prop": [-8.4, -14.6], "local": [-0.69, -14.6], "why": "Mission 3 is the farmer's routine, so its schedule board belongs at the farmhouse door. It's kept 2+ tiles from the Well so clicks don't land on the wrong one."}, {"n": 13, "prio": "high", "name": "Grid/GroundTilemap (grass fill)", "parent": null, "cur": null, "prop": [-21.0, 16.0], "local": null, "why": "Add new: paint grass across the whole frame (\u221227\u202627) so no orange or blue void shows. About half the frame is empty right now, so the world feels unfinished and doesn't invite exploration."}, {"n": 14, "prio": "high", "name": "TrashCoords/T4", "parent": null, "cur": [7.03, -11.12], "prop": [6.5, -14.4], "local": null, "why": "Its current spot will be inside the new river, so trash spawning here couldn't be reached; this moves it onto the south-bank path."}, {"n": 15, "prio": "high", "name": "TrashCoords/T7", "parent": null, "cur": [13.36, -12.0], "prop": [12.6, -14.8], "local": null, "why": "Sits on the new river's edge, so move it to the walkable south bank on the way to the Mission 5 bridge."}, {"n": 16, "prio": "medium", "name": "Entities/TownHall", "parent": null, "cur": [2.5, 0.32], "prop": [-1.0, 1.82], "local": null, "why": "Moving it a few tiles left of centre breaks the formal centred look; the plaza then opens to the south-east toward the market, the way the player walks."}, {"n": 17, "prio": "medium", "name": "Entities/MissionBoard", "parent": null, "cur": [-1.93, 1.33], "prop": [-6.5, -0.4], "local": null, "why": "The two boards mirror each other on either side of the town hall door; moving this one to the plaza's front-left corner breaks the mirror and keeps it in view on the way to the falls."}, {"n": 18, "prio": "medium", "name": "Entities/InfoBoard", "parent": null, "cur": [1.79, 1.38], "prop": [2.2, -1.6], "local": null, "why": "Puts the help board a few steps from the spawn point at (0,0), so it's the first thing a new player passes."}, {"n": 19, "prio": "medium", "name": "Mission4/MarketNPC", "parent": "Mission4", "cur": [8.02, -4.16], "prop": [11.2, -3.2], "local": [2.93, 1.08], "why": "Puts the merchant in the middle of the new market street so the Mission 4 trigger reads as part of the market."}, {"n": 20, "prio": "medium", "name": "MarketHouse (new, sprite MarketHouse.png)", "parent": null, "cur": null, "prop": [20.5, -2.8], "local": null, "why": "Add new: a building at the street's end gives the market a destination, so the stall street leads somewhere instead of being a square to walk around."}, {"n": 21, "prio": "medium", "name": "Entities/Market/Market1", "parent": "Entities/Market", "cur": [5.75, -1.0], "prop": [7.2, -1.6], "local": [1.85, 5.06], "why": "First stall at the street's mouth, nearest the plaza, where the market starts."}, {"n": 22, "prio": "medium", "name": "Entities/Market/Market2", "parent": "Entities/Market", "cur": [10.1, -0.94], "prop": [10.6, -0.4], "local": [5.25, 6.26], "why": "North side of the street, set back slightly so it doesn't line up with Market1."}, {"n": 23, "prio": "medium", "name": "Entities/Market/Market3", "parent": "Entities/Market", "cur": [4.62, -2.95], "prop": [9.0, -5.0], "local": [3.65, 1.66], "why": "South side, opposite the gap between Market1 and Market2, so the street zig-zags."}, {"n": 24, "prio": "medium", "name": "Entities/Market/Market4", "parent": "Entities/Market", "cur": [11.43, -3.17], "prop": [13.9, -1.9], "local": [8.55, 4.76], "why": "North side, where the street begins to curve."}, {"n": 25, "prio": "medium", "name": "Entities/Market/Market5", "parent": "Entities/Market", "cur": [4.65, -6.04], "prop": [12.4, -6.4], "local": [7.05, 0.26], "why": "South side, on the river side, so the market feels like a riverside street."}, {"n": 26, "prio": "medium", "name": "Entities/Market/Market6", "parent": "Entities/Market", "cur": [11.42, -6.02], "prop": [16.6, -4.2], "local": [11.25, 2.46], "why": "Near the MarketHouse, leading the eye to the street's end."}, {"n": 27, "prio": "medium", "name": "Entities/Market/Market7", "parent": "Entities/Market", "cur": [6.74, -7.62], "prop": [15.4, -8.1], "local": [10.05, -1.44], "why": "Riverside stall with an uneven gap to Market5, avoiding the old ring's even spacing."}, {"n": 28, "prio": "medium", "name": "Entities/Market/Market8", "parent": "Entities/Market", "cur": [9.51, -7.54], "prop": [18.5, -7.0], "local": [13.15, -0.34], "why": "Last stall before the MarketHouse; no two stalls share a row or column."}, {"n": 29, "prio": "medium", "name": "Mission1/Container_Trivial_M1/Brick", "parent": null, "cur": [-12.33, -4.23], "prop": [13.8, 1.8], "local": null, "why": "A brick naturally comes from the smithy; putting it there makes the quick fix a real errand back across the footbridge."}, {"n": 30, "prio": "medium", "name": "Mission2/Container_Optimal_M2/PartCollectionSystem/MachinePart_1", "parent": "Mission2/Container_Optimal_M2/PartCollectionSystem", "cur": [-9.82, 8.25], "prop": [-19.5, -8.0], "local": [-13.48, -19.47], "why": "All three parts are bunched near the falls; moving one to the west bank turns 'collect 3 parts' into a short tour of the map."}, {"n": 31, "prio": "medium", "name": "Mission2/Container_Optimal_M2/PartCollectionSystem/MachinePart_2", "parent": "Mission2/Container_Optimal_M2/PartCollectionSystem", "cur": [-10.82, 10.91], "prop": [-1.0, 14.5], "local": [5.02, 3.03], "why": "Second part up on the clifftop by the stairs, which also gets the player to visit the cliff area; MachinePart_3 stays near the falls."}, {"n": 32, "prio": "medium", "name": "Mission2/RiverDryPoint", "parent": "Mission2", "cur": [-12.99, 1.01], "prop": [-10.6, -2.4], "local": [22.75, 12.0], "why": "Moves this 'thin riverbed' talk point onto the new dry riverbed's bank, so the context it gives sits where the problem is."}, {"n": 33, "prio": "medium", "name": "Grid/GroundTilemap (crop field A)", "parent": null, "cur": null, "prop": [-11.5, -19.0], "local": null, "why": "Add new: a 6\u00d74 field of Spring Crops/FarmAsset tiles beside the Well, so the parched crops of Mission 1 are actually visible."}, {"n": 34, "prio": "medium", "name": "Grid/GroundTilemap (crop field B)", "parent": null, "cur": null, "prop": [-2.5, -18.6], "local": null, "why": "Add new: a smaller 4\u00d73 field, offset from field A, so the farm doesn't read as one rectangle."}, {"n": 35, "prio": "medium", "name": "Orchard (new: Maple Tree + ChestGold)", "parent": null, "cur": null, "prop": [21.5, -17.5], "local": null, "why": "Add new: give the far side of the Mission 5 bridge a destination, so fixing it opens somewhere. Put nothing mission-critical here, since that would make other missions depend on Mission 5."}, {"n": 36, "prio": "medium", "name": "Fountain (new, sprite Fountain.png)", "parent": null, "cur": null, "prop": [4.6, -4.6], "local": null, "why": "Add new: an off-centre plaza centrepiece, placed at least 2 tiles from TrashCoords/T5 and the InfoBoard."}, {"n": 37, "prio": "medium", "name": "Grid/GroundTilemap + Grid/CollisionTilemap (cliff segment x \u22124.5\u20261)", "parent": null, "cur": [-1.8, 10.5], "prop": [-1.8, 12.0], "local": null, "why": "Raise this stretch of cliff by 1\u20132 tiles, so the band jogs instead of running ruler-straight across the top of town."}, {"n": 38, "prio": "low", "name": "Trees (new: tree2/tree3/Maple Tree, west belt)", "parent": null, "cur": null, "prop": [-22.5, 2.0], "local": null, "why": "Add new: a forest edge 3\u20134 trees deep along the west border, framing the map and hiding the edge of the walkable grid at x = \u221225."}, {"n": 39, "prio": "low", "name": "Trees (new: tree3/tree4, north-west belt)", "parent": null, "cur": null, "prop": [-19.5, 17.0], "local": null, "why": "Add new: a dense cluster behind the falls, so the waterfall reads as coming out of wild land."}, {"n": 40, "prio": "low", "name": "Trees (new: tree2/tree4, south belt)", "parent": null, "cur": null, "prop": [3.0, -21.5], "local": null, "why": "Add new: a south-border tree line, thinning toward the crop fields so the farm still reads as clearing."}, {"n": 41, "prio": "low", "name": "Trees (new: Maple Tree/tree3, east belt)", "parent": null, "cur": null, "prop": [23.0, 8.0], "local": null, "why": "Add new: an east-border tree line behind the blacksmith, broken by a gap at the MarketHouse."}, {"n": 42, "prio": "low", "name": "TrashCoords/T3", "parent": null, "cur": [6.12, -0.36], "prop": [4.9, 0.9], "local": null, "why": "Keeps the spawn point at least 2 tiles clear of the relocated Market1."}, {"n": 43, "prio": "low", "name": "TrashCoords/T6", "parent": null, "cur": [13.62, -5.88], "prop": [14.6, -5.4], "local": null, "why": "Moves the spawn point onto the open street between Market4, Market5 and Market6 so trash never lands under a stall."}];
const STATIONS = [["Spawn", [0, 0]], ["InfoBoard", [2.2, -1.6]], ["MissionBoard", [-6.5, -0.4]], ["MarketNPC (M4)", [11.2, -3.2]], ["VIllagerComplaintPoint", [-12.41, 7.04]], ["RiverBlockagePoint (M2)", [-16.99, 6.01]], ["RiverDryPoint", [-10.6, -2.4]], ["Footbridge", [-4.5, -9.7]], ["RoutineBoardInteractable (M3)", [-8.4, -14.6]], ["Well (M1)", [-6.0, -15.5]], ["BridgeInteractable (M5)", [15.12, -15.2]], ["Footbridge", [-4.5, -9.7]], ["TownHall", [-3.5, 2.0]]];
const RIVER = [[-14.5, 4], [-12.5, -3], [-7.5, -8.5], [0, -11.5], [8, -12], [13.5, -10.5], [17, -12], [17, -14.6], [16, -19], [16.8, -25]];

const img = document.getElementById('mapimg');
const svg = document.getElementById('overlay');
const NS = 'http://www.w3.org/2000/svg';
const fmt = p => `(${p[0].toFixed(2)}, ${p[1].toFixed(2)})`;

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

function build() {
  const W = img.naturalWidth, H = img.naturalHeight;
  const halfH = CAM.size, halfW = CAM.size * W / H;
  const toPx = ([x, y]) => [(x - CAM.x + halfW) / (2 * halfW) * W, (CAM.y + halfH - y) / (2 * halfH) * H];

  document.getElementById('method').innerHTML =
    `<b>Coordinate mapping.</b> Capture camera at (${CAM.x}, ${CAM.y}), orthographic size ${CAM.size}, image ${W}×${H} px → ` +
    `${(H / (2 * CAM.size)).toFixed(2)} px per world unit. Checked against <code>Entities/Player</code> (0, 0), ` +
    `<code>Entities/Well</code> (−8.79, −6.46) and <code>Entities/Bridge</code> (16.96, −14.6), which all land on their sprites. ` +
    `Positions are <b>world (x, y)</b>; this is a 2D scene, so z is only depth. For objects under a non-zero parent, ` +
    `“Inspector local” is the value to type into the Transform (parents here have no rotation and scale 1). ` +
    `The walkable pathfinding grid only covers −25…25 on both axes.`;

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const defs = el('defs', {}, svg);
  const mk = el('marker', { id: 'arrow', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 5, markerHeight: 5, orient: 'auto-start-reverse' }, defs);
  el('path', { d: 'M0,0 L10,5 L0,10 z', fill: '#fff', stroke: '#000', 'stroke-width': 1 }, mk);

  // Proposed river course
  el('polyline', { points: RIVER.map(toPx).map(p => p.join(',')).join(' '), fill: 'none',
    stroke: 'var(--river)', 'stroke-width': 9, 'stroke-opacity': .5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg);

  // Intended player path
  const pts = STATIONS.map(s => toPx(s[1]));
  el('polyline', { points: pts.map(p => p.join(',')).join(' '), fill: 'none', stroke: 'var(--path)',
    'stroke-width': 2.5, 'stroke-dasharray': '7 5', 'stroke-linejoin': 'round' }, svg);
  const seen = new Set();
  STATIONS.forEach(([name, pos], i) => {
    const [x, y] = toPx(pos);
    const g = el('g', { class: 'station' }, svg);
    el('circle', { cx: x, cy: y, r: 3.5, fill: 'var(--path)', stroke: '#fff', 'stroke-width': 1.2 }, g);
    el('title', {}, g).textContent = `Stop ${i + 1}: ${name}`;
    const key = pos.join();
    const t = el('text', { x: x - 5, y: y - 6, 'text-anchor': 'end' }, g);
    t.textContent = `P${i + 1}`;
    if (seen.has(key)) t.setAttribute('x', x - 14);
    seen.add(key);
  });

  // Recommendation markers
  const R = 6;
  ITEMS.forEach(it => {
    const g = el('g', { class: 'marker', id: 'm' + it.n, 'data-n': it.n }, svg);
    const cur = it.cur ? toPx(it.cur) : null;
    const prop = Array.isArray(it.prop) ? toPx(it.prop) : null;
    if (cur && prop) {
      const dx = prop[0] - cur[0], dy = prop[1] - cur[1], d = Math.hypot(dx, dy) || 1;
      el('line', { x1: cur[0] + dx / d * R, y1: cur[1] + dy / d * R, x2: prop[0] - dx / d * (R + 1), y2: prop[1] - dy / d * (R + 1),
        stroke: '#fff', 'stroke-width': 1.8, 'stroke-opacity': .9, 'marker-end': 'url(#arrow)' }, g);
    }
    if (cur) {
      el('circle', { cx: cur[0], cy: cur[1], r: R, fill: 'rgba(214,58,47,.25)', stroke: 'var(--red)', 'stroke-width': 2.2 }, g);
      if (it.prop === 'remove') {
        el('path', { d: `M${cur[0] - 4},${cur[1] - 4} L${cur[0] + 4},${cur[1] + 4} M${cur[0] + 4},${cur[1] - 4} L${cur[0] - 4},${cur[1] + 4}`,
          stroke: 'var(--red)', 'stroke-width': 2.2 }, g);
      }
    }
    if (prop) {
      const c = el('circle', { cx: prop[0], cy: prop[1], r: R, fill: 'rgba(31,157,85,.3)', stroke: 'var(--green)', 'stroke-width': 2.2 }, g);
      if (!cur) c.setAttribute('stroke-dasharray', '3 2');
    }
    const at = prop || cur;
    el('text', { x: at[0] + R + 1, y: at[1] + 4 }, g).textContent = it.n;
    if (cur && prop) el('text', { x: cur[0] + R + 1, y: cur[1] + 4 }, g).textContent = it.n;
    el('title', {}, g).textContent = `${it.n}. ${it.name}`;
    g.addEventListener('mouseenter', () => highlight(it.n, true));
    g.addEventListener('mouseleave', () => highlight(it.n, false));
  });

  // List
  const list = document.getElementById('list');
  const labels = { high: 'High priority', medium: 'Medium priority', low: 'Low priority' };
  for (const pr of ['high', 'medium', 'low']) {
    const group = ITEMS.filter(i => i.prio === pr);
    if (!group.length) continue;
    const h = document.createElement('h2');
    h.style.color = `var(--${pr})`;
    h.innerHTML = `${labels[pr]} <span class="pill">${group.length}</span>`;
    list.appendChild(h);
    const ol = document.createElement('ol');
    group.forEach(it => {
      const li = document.createElement('li');
      li.id = 'i' + it.n;
      li.style.setProperty('--c', `var(--${pr})`);
      const curTxt = it.cur ? fmt(it.cur) : '— (doesn’t exist yet)';
      const propTxt = it.prop === 'remove' ? 'remove' : (it.cur ? fmt(it.prop) : 'add new at ' + fmt(it.prop));
      const local = it.local ? `<span>Inspector local (under <code>${it.parent}</code>): <b>${fmt(it.local)}</b></span>` : '';
      li.innerHTML =
        `<div class="head"><span class="num">${it.n}</span><code class="name">${it.name}</code></div>` +
        `<div class="pos"><span>Current: <b>${curTxt}</b></span><span>Proposed: <b>${propTxt}</b></span>${local}</div>` +
        `<p class="why">${it.why}</p>`;
      li.addEventListener('mouseenter', () => highlight(it.n, true));
      li.addEventListener('mouseleave', () => highlight(it.n, false));
      ol.appendChild(li);
    });
    list.appendChild(ol);
  }
}

function highlight(n, on) {
  const g = document.getElementById('m' + n), li = document.getElementById('i' + n);
  svg.classList.toggle('dim', on);
  g.classList.toggle('hl', on);
  li.classList.toggle('hl', on);
  if (on) svg.appendChild(g);   // bring to front
}

if (img.complete) build(); else img.addEventListener('load', build);
</script>
</body>
</html>
